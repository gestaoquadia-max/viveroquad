
<script>
(function () {
  var score = 1240;   // Quad Coins (moeda da Loja — NÃO é o score de carreira)

  /* ==================================================================
     MÓDULO GAMIFICAÇÃO · configuração central (o admin ajustará no
     sistema real; pendência conhecida: PROVA_APROV segue fixa em 80% e
     as notaMin das fases ainda não são lidas por ninguém)
     ================================================================== */
  var GAMI = {
    provaQuestoes: 20,
    tentativaHoras: 24,
    fases: [
      { nome: 'Formação inicial',     notaMin: 0.70 },
      { nome: 'Formação de liderança', notaMin: 0.75 },
      { nome: 'Formação de oficial',  notaMin: 0.80 },
      { nome: 'Alto comando',         notaMin: 0.85 }
    ],
    // pontos = score necessário para liberar a prova rumo à PRÓXIMA patente
    patentes: [
      { nome: 'Aluno Soldado Quad',   abrev: 'AL SD',  fase: 0, pontos: 900 },
      { nome: 'Soldado Quad',         abrev: 'SD',     fase: 0, pontos: 3300 },
      { nome: 'Aluno Cabo Quad',      abrev: 'AL CB',  fase: 0, pontos: 4200 },
      { nome: 'Cabo Quad',            abrev: 'CB',     fase: 0, pontos: 5500 },
      { nome: 'Aluno Sargento Quad',  abrev: 'AL SGT', fase: 1, pontos: 7000 },
      { nome: 'Sargento Quad',        abrev: 'SGT',    fase: 1, pontos: 8500 },
      { nome: 'Subtenente Quad',      abrev: 'ST',     fase: 1, pontos: 9500 },
      { nome: 'Aluno Oficial Quad',   abrev: 'AL OF',  fase: 2, pontos: 11000 },
      /* dec. 214 — a escala CRESCE até o fim: de Aspirante em diante ela
         estava travada em 12.500 desde a primeira versão (placeholder), o
         que fazia subir a Coronel custar o mesmo que virar Tenente. Segue
         o passo já estabelecido no topo da tabela: +1.500 por patente   */
      { nome: 'Aspirante Quad',       abrev: 'ASP',    fase: 2, pontos: 12500 },
      { nome: 'Tenente Quad',         abrev: 'TEN',    fase: 2, pontos: 14000 },
      { nome: 'Capitão Quad',         abrev: 'CAP',    fase: 3, pontos: 15500 },
      { nome: 'Major Quad',           abrev: 'MAJ',    fase: 3, pontos: 17000 },
      { nome: 'Tenente-Coronel Quad', abrev: 'TC',     fase: 3, pontos: 18500 },
      { nome: 'Coronel Quad',         abrev: 'CEL',    fase: 3, pontos: null }  // patente máxima
    ]
  };

  // estado do aluno (simulado; no sistema real vem validado do servidor —
  // a interface nunca decide sozinha quantos pontos foram conquistados)
  var carreira = {
    nomeCompleto: 'Danilo Ribeiro Moura',
    nomeGuerra: 'Moura',
    patenteIdx: 0,
    scorePatente: 620,
    scoreCarreira: 620,
    scoreTemporada: 310,
    estado: 'acumulando', // acumulando · disponivel · aguardando-fiscal · prova · bloqueada
    provaBloqueadaAte: null,
    historico: [ { patente: 'Aluno Soldado Quad', data: '10/07/2026', obs: 'entrada no aplicativo' } ]
  };
  /* dec. 212 — entrada do aluno na plataforma (aparece no perfil público);
     na plataforma real vem do cadastro [INTEGRAÇÃO REAL]              */
  var MEU_DESDE = '11/05/2026';
  function patenteAtual() { return GAMI.patentes[carreira.patenteIdx]; }
  function proximaPatente() { return GAMI.patentes[carreira.patenteIdx + 1] || null; }
  function tituloCompleto() { return patenteAtual().nome + ' ' + carreira.nomeGuerra; }
  function nomeCurto() {
    var g = carreira.nomeGuerra ? carreira.nomeGuerra : '______';   /* sem nome de guerra ainda → lacuna */
    return (patenteAtual().abrev + ' QUAD ' + g).toUpperCase();
  }

  // ---- estado de acesso e conectividade (SIMULADO no front-end) ----
  // [MÓDULO PLANEJADO · Autenticação] o acesso real será do módulo de
  // autenticação da plataforma (Consolidação Arquitetural v1.0); aqui é mock.
  var online = true;          // rede simulada (alternável pelo toggle da statusbar)
  // persistência simulada só no navegador
  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { window.localStorage.removeItem(k); } catch (e) {} }

  function $(id) { return document.getElementById(id); }
  function fmt(n) { return n.toLocaleString('pt-BR'); }

  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.remove('go');
    void t.offsetWidth;
    t.classList.add('go');
  }

  /* ---------- DA-01: identidade por ID interno imutável ----------
     O ID é gerado na criação do registro e nunca muda; o nome é atributo,
     nunca chave de relacionamento. DA-04: nomes de guerra podem repetir —
     quem desempata é o ID.                                              */
  function novoId(prefixo) { idSeq += 1; return prefixo + '-' + String(idSeq).padStart(5, '0'); }
  var idSeq = 0;
  var MEU_ID = 'AL-00001';   /* aluno da demonstração */

  /* ---------- DA-03: ledger — o saldo é consequência, não campo ----------
     Nenhuma alteração de saldo ocorre sem o lançamento que a originou.
     Cada movimento guarda origem, destino, tipo, data/hora, autor, valor e
     o saldo resultante. Vale para Quad Coins, Diamantes e Score.        */
  var LEDGER = [];
  var ledgerCtx = null;   /* {tipo, origem, destino, autor} da operação em curso */
  function ledgerLancar(moeda, valor, saldo) {
    var c = ledgerCtx || {};
    LEDGER.unshift({
      id: novoId('MV'), moeda: moeda, valor: valor, saldo: saldo,
      tipo: c.tipo || (valor >= 0 ? 'crédito' : 'débito'),
      origem: c.origem || (valor >= 0 ? 'sistema' : nomeCurto()),
      destino: c.destino || (valor >= 0 ? nomeCurto() : 'Quad Store'),
      autor: c.autor || 'sistema', quando: new Date(), ts: Date.now()
    });
    if (typeof renderExtrato === 'function') renderExtrato();
  }
  /* toda operação declara o seu contexto: ledgerOp({...}, function(){...}) */
  function ledgerOp(ctx, fn) {
    var antes = ledgerCtx; ledgerCtx = ctx;
    try { return fn(); } finally { ledgerCtx = antes; }
  }
  window.__ledger = function () { return LEDGER; };   /* para a suíte de testes */
  window.__ids = function () { return { aluno: (typeof DB_ALUNO !== 'undefined') ? DB_ALUNO.id : MEU_ID, seq: idSeq }; };
  window.__carteira = function () { return { score: score, diamantes: diamantes, mochila: (typeof MOCHILA !== 'undefined') ? MOCHILA.length : 0 }; };

  var evolAtivo = false;   /* liga depois do boot (DA-10) */
  function addScore(n, msg) {
    score += n;
    if (n !== 0) ledgerLancar('qdc', n, score);
    if (evolAtivo && typeof evolMarcar === 'function') evolMarcar();
    $('scoreVal').textContent = fmt(score);
    $('scorePerfil').textContent = fmt(score);
    var ls = $('lojaSaldo'); if (ls) ls.textContent = fmt(score);
    var pop = $('scorePop');
    pop.textContent = (n > 0 ? '+' : '') + n;
    pop.classList.remove('go');
    void pop.offsetWidth;
    pop.classList.add('go');
    if (msg) toast(msg);
  }

  /* ---------- Diamante: moeda comprada em dinheiro (site/gift card) ----------
     Não é conquistado em missões. Chega por recarga do site (checkout) ou por
     gift card presencial de liberação única. [INTEGRAÇÃO REAL] crédito do site */
  var diamantes = 150;   // recarga vinda do checkout do site (demo)
  function addDiamante(n, msg) {
    diamantes += n;
    if (n !== 0) ledgerLancar('dmn', n, diamantes);
    if (evolAtivo && typeof evolMarcar === 'function') evolMarcar();
    var el = $('dmnVal'); if (el) el.textContent = fmt(diamantes);
    var ls = $('lojaSaldoDmn'); if (ls) ls.textContent = fmt(diamantes);
    if (msg) toast(msg);
  }
  /* [DEMO] códigos de recarga usados só para demonstrar a tela — os gift cards
     de verdade nascem em lote no Painel de controle, no formato QG<lote>-<código>. */
  var GIFT_CARDS = { 'QUAD-100': 100, 'QUAD-500': 500 };
  var giftUsados = {};
  var GIFT_LOTES = [];   /* lotes criados no Painel de controle: cada código com QR e liberação única */
  function giftDoLote(c) {
    for (var i = 0; i < GIFT_LOTES.length; i++) {
      var g = GIFT_LOTES[i].codes.filter(function (x) { return x.c === c; })[0];
      if (g) return { g: g, lote: GIFT_LOTES[i] };
    }
    return null;
  }
  function resgatarGift(codigo) {
    var c = (codigo || '').trim().toUpperCase();
    var hit = giftDoLote(c);
    if (hit) {
      if (hit.g.usado) { toast('Este gift card já foi resgatado (liberação única).'); return false; }
      hit.g.usado = true;   /* invalida o QR na mesma hora */
      ledgerOp({ tipo: 'gift card · ' + c, origem: 'gift card presencial', autor: 'recepção' }, function () {
        if (hit.lote.moeda === 'dmn') addDiamante(hit.lote.valor, 'Gift card validado — +' + fmt(hit.lote.valor) + ' Diamantes!');
        else addScore(hit.lote.valor, 'Gift card validado — +' + fmt(hit.lote.valor) + ' Quad Coins!');
      });
      if (typeof renderGiftLotes === 'function') renderGiftLotes();
      return true;
    }
    if (!GIFT_CARDS[c]) { toast('Gift card inválido — confira o código.'); return false; }
    if (giftUsados[c]) { toast('Este gift card já foi resgatado (liberação única).'); return false; }
    giftUsados[c] = true;
    ledgerOp({ tipo: 'gift card · ' + c, origem: 'gift card presencial', autor: 'recepção' }, function () {
      addDiamante(GIFT_CARDS[c], 'Gift card resgatado — +' + GIFT_CARDS[c] + ' Diamantes!');
    });
    return true;
  }

  /* ---------- turmas: catálogo da Quad Store + matrículas do aluno ----------
     Turma nasce no Painel de controle e vende em DUAS moedas com vagas
     separadas (gerais − QdC = Dmn). Matrícula bloqueia o turno; sem
     matrícula ativa, o app trava até entrar numa nova turma.            */
  /* banco de professores (Painel de controle) — fonte de verdade do corpo
     docente. Alimenta a criação de turmas e a área do professor.
     (pendência: a grade CRONO ainda cita nomes fora deste banco)        */
  __SEED_DOCENTES__
  function docenteDe(nome) { return DOCENTES.filter(function (d) { return d.nome === nome; })[0]; }
  function docentesAtivos() { return DOCENTES.filter(function (d) { return !d.desligado; }); }
  function matNorm(x) { return (x || '').toLowerCase().replace(/\s+/g, ' ').trim(); }
  function materiaCasa(docMat, treeMat) {
    var a = matNorm(docMat), b = matNorm(treeMat);
    return a === b || b.indexOf(a) === 0 || a.indexOf(b) === 0;   /* "Matemática" cobre "Matemática e Raciocínio Lógico" */
  }
  function docentesDaMateria(mat) {
    return docentesAtivos().filter(function (d) {
      return d.materias.some(function (m) { return materiaCasa(m, mat); });
    });
  }
  /* PROFESSORES continua existindo (usado como fallback) e reflete os ativos */
  var PROFESSORES = DOCENTES.map(function (d) { return d.nome; });
  function sincProfessores() {
    PROFESSORES.length = 0;
    docentesAtivos().forEach(function (d) { PROFESSORES.push(d.nome); });
  }
  sincProfessores();
  __SEED_TURMAS_LOJA__
  /* o aluno da demo veio do site já matriculado na PATAMO Noite (CFO) */
  var MATRICULAS = [
    { turmaId: 'patamo-n', rot: 'PATAMO NOITE', tipo: 'PATAMO', turno: 'noite', concurso: 'cfo', fim: '2026-12-15' },
    /* turma já concluída: fica ARQUIVADA no perfil, com histórico (DA-06) */
    { turmaId: 'rondesp-m', rot: 'RONDESP MANHÃ', tipo: 'RONDESP', turno: 'manhã', concurso: 'sdba', fim: '2026-06-30', arquivada: true }
  ];
  function turmaDe(id) { return TURMAS_LOJA.filter(function (t) { return t.id === id; })[0]; }
  function matriculasAtivas() { var h = hojeISO(); return MATRICULAS.filter(function (m) { return !m.fim || m.fim >= h; }); }
  /* DA-06: a matrícula encerrada não é apagada — fica arquivada e consultável */
  function matriculasArquivadas() { var h = hojeISO(); return MATRICULAS.filter(function (m) { return m.fim && m.fim < h; }); }
  /* ---------- turma ATIVA: por qual matrícula o app fala ----------
     O aluno pode ter mais de uma turma. Uma delas comanda a tela —
     Aula de hoje, avisos, ranking da sala, Domínio e quiz — e ele troca
     quando quiser, sem sair da conta. Antes valia sempre a matrícula
     mais antiga, e a turma nova entrava muda.                        */
  var turmaAtivaId = 'patamo-n';
  function turmaAtiva() {
    var ats = matriculasAtivas();
    if (!ats.length) { turmaAtivaId = null; return null; }
    var m = ats.filter(function (x) { return x.turmaId === turmaAtivaId; })[0] || ats[0];
    turmaAtivaId = m.turmaId;
    return turmaDe(m.turmaId) || null;
  }
  function definirTurmaAtiva(id, silencioso) {
    var m = matriculasAtivas().filter(function (x) { return x.turmaId === id; })[0];
    if (!m) return false;
    turmaAtivaId = id;
    var t = turmaDe(id);
    if (t) {
      /* a chave do cronograma continua sendo tipo + turno; o nome e a
         sala mostrados na Aula de hoje saem da turma de verdade      */
      if (typeof cronoKey === 'function') ALUNO_TURMA = cronoKey(t);
      if (typeof definirDominio === 'function' && typeof concursoDe === 'function' && concursoDe(t.concurso)) definirDominio(t.concurso);
    }
    if (typeof renderCarreira === 'function') renderCarreira();
    if (typeof renderAulaHoje === 'function') renderAulaHoje();
    if (typeof renderAvisos === 'function') renderAvisos();
    if (typeof renderRankings === 'function') renderRankings();
    if (typeof renderMinhasTurmas === 'function') renderMinhasTurmas();
    if (typeof renderMateriaisAluno === 'function') renderMateriaisAluno();
    if (typeof refreshQuizAula === 'function') refreshQuizAula();
    if (typeof renderCalendario === 'function') renderCalendario();
    if (typeof renderDomTurma === 'function') renderDomTurma();
    /* a aba Missões inteira fala pela turma ativa */
    if (typeof trTrocaTurma === 'function') trTrocaTurma();
    if (typeof renderDia === 'function') renderDia();          /* + heroSync */
    if (typeof renderAtrasadas === 'function') renderAtrasadas();
    if (!silencioso && t) toast('Você está na ' + t.nome + ' — Início, avisos, ranking e Domínio passam a ser desta turma.');
    return true;
  }
  window.__turmaAtiva = function () { return turmaAtivaId; };
  function turnoOcupadoPor(turno) {
    var at = matriculasAtivas().filter(function (m) { return m.turno === turno; })[0];
    return at ? ('Turma ' + at.tipo) : null;
  }
  var appLock = false;
  function checarMatricula() {
    appLock = matriculasAtivas().length === 0;
    if (appLock) { var ml = $('matLayer'); if (ml) ml.classList.add('on'); }
  }
  /* exposto para a suíte de testes: simula o fim da turma sem viajar no tempo */
  window.__mat = {
    encerrar: function () { MATRICULAS.length = 0; checarMatricula(); if (typeof renderTurmasLoja === 'function') renderTurmasLoja(); },
    ativas: function () { return matriculasAtivas().length; }
  };

  /* ---------- personas ---------- */
  var personaAtiva = 'aluno';
  var personaViews = {
    aluno: { nav: 'navAluno', home: 'v-inicio' },
    professor: { nav: 'navProfessor', home: 'v-prof-painel' },
    admin: { nav: 'navAdmin', home: 'v-adm-controle' }
  };
  document.querySelectorAll('.persona-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.persona-btn').forEach(function (x) {
        x.classList.remove('active'); x.setAttribute('aria-selected', 'false');
      });
      b.classList.add('active'); b.setAttribute('aria-selected', 'true');
      var p = b.dataset.persona;
      personaAtiva = p;
      document.querySelectorAll('.app-top').forEach(function (t) {
        t.style.display = (t.dataset.scope === p) ? 'flex' : 'none';
      });
      ['navAluno', 'navProfessor', 'navAdmin'].forEach(function (n) {
        $(n).style.display = (n === personaViews[p].nav) ? 'flex' : 'none';
      });
      showView(personaViews[p].home, personaViews[p].nav);
      /* cadastro específico do administrador: exige liberação da direção */
      var ag = $('admGate');
      if (ag) ag.classList.toggle('on', p === 'admin' && !admLiberado);
      var pg = $('profGate');
      if (pg) pg.classList.toggle('on', p === 'professor' && !profLiberado);
      /* o robô de ajuda é do aluno — na área do administrador ele some */
      /* o robô de ajuda é do aluno — some nas áreas de professor e administrador */
      $('daniloFab').style.display = (p !== 'aluno' || (typeof tutOn !== 'undefined' && tutOn)) ? 'none' : '';
      if (p !== 'aluno') { $('daniloHint').style.display = 'none'; }
    });
  });

  /* dados que chegam do banco de dados geral (o aluno se cadastrou no site).
     [INTEGRAÇÃO REAL] preenchidos a partir da matrícula ativa do aluno. */
  var DB_ALUNO = { id: MEU_ID, nome: 'Danilo de Almeida Moura', fone: '(71) 9 8877-2301' };

  /* ---------- engrenagem: roda 3D do Início ----------
     (a rolagem infinita vertical que triplicava o conteúdo saiu na
      dec. 201 — o Início rola e PARA no fim, como as demais abas)   */
  var RODA_VIEWS = ['v-inicio']; // roda 3D apenas no Início
  var tourOn = false;
  function spotlight(view) {
    var cards = view.querySelectorAll('.p-card');
    if (!cards.length) return;
    /* a "engrenagem" 3D é exclusiva do Início — nas demais views (Loja,
       Missões, Domínio, admin) os blocos ficam PLANOS, senão um card alto
       tomba e invade o vizinho (ex.: presenciais × itens digitais). */
    if (RODA_VIEWS.indexOf(view.id) < 0) {
      cards.forEach(function (c) { c.style.transform = ''; c.style.opacity = ''; c.classList.remove('spot'); });
      return;
    }
    var rect = view.getBoundingClientRect();
    var mid = rect.top + rect.height / 2;
    var half = rect.height / 2 + 40;
    // fase 1: só leituras (evita layout thrashing durante o scroll)
    var offs = [], hts = [], best = null, bestD = Infinity;
    cards.forEach(function (c, i) {
      var r = c.getBoundingClientRect();
      var off = (r.top + r.height / 2) - mid;
      offs[i] = off; hts[i] = r.height;
      var d = Math.abs(off);
      if (d < bestD) { bestD = d; best = c; }
    });
    // fase 2: só escritas
    cards.forEach(function (c, i) {
      var n = Math.max(-1, Math.min(1, offs[i] / half));
      /* cards altos giram menos — senão a borda de um card gigante invade o
         vizinho (ex.: herói da Quad Store × bloco de itens presenciais) */
      var att = Math.min(1, 320 / Math.max(120, hts[i]));
      c.style.transform = 'perspective(1100px) rotateX(' + (n * -7 * att).toFixed(2) + 'deg) scale(' + (1 - Math.abs(n) * 0.04 * att).toFixed(3) + ')';
      c.style.opacity = (1 - Math.abs(n) * 0.22).toFixed(3);
      c.classList.toggle('spot', c === best);
    });
  }
  document.querySelectorAll('.view').forEach(function (v) {
    v.addEventListener('scroll', function () { spotlight(v); }, { passive: true });
  });

  /* ---------- nav ---------- */
  var currentView = 'v-inicio';
  function showView(id, navId) {
    currentView = id;
    document.querySelectorAll('.view').forEach(function (v) { v.classList.remove('on'); });
    $(id).classList.add('on');
    if (navId) {
      document.querySelectorAll('#' + navId + ' .nav-btn').forEach(function (nb) {
        nb.classList.toggle('active', nb.dataset.view === id);
      });
    }
    /* área do admin abre limpa (ou no bloco que estava aberto) */
    if (id.indexOf('v-adm-') === 0 && typeof admJumpRestaura === 'function') admJumpRestaura(id);
    /* ao abrir o Início, a "Aula de hoje" se atualiza com o cronograma e o horário */
    if (id === 'v-inicio' && typeof renderAulaHoje === 'function') renderAulaHoje();
    if (id === 'v-inicio' && typeof renderEvStrip === 'function') renderEvStrip();       /* tira do carrossel o que venceu */
    if (id === 'v-loja' && typeof renderEventosLoja === 'function') renderEventosLoja(); /* e da vitrine */
    if (id === 'v-loja' && typeof renderRelCompras === 'function') renderRelCompras();   /* relatório de compras sempre atual */
    if (id === 'v-loja' && typeof renderMercado === 'function') renderMercado();         /* mercado interno (dec. 216) */
    if (id === 'v-minha-loja' && typeof renderMinhaLoja === 'function') renderMinhaLoja();
    /* abrir Missões revalida os 7 dias: o que venceu sai de "Hoje" e entra em "Atrasadas" */
    if (id === 'v-missoes') {
      if (typeof renderDia === 'function') renderDia();
      if (typeof renderAtrasadas === 'function') renderAtrasadas();
    }
    if (id === 'v-adm-loja' && typeof renderPrecos === 'function') renderPrecos();   /* editores nunca com preço velho */
    if (id === 'v-adm-liber' && typeof renderAcessos === 'function') renderAcessos(); /* portaria sempre sincronizada */
    if (id === 'v-calendario') {
      if (typeof renderCalendario === 'function') renderCalendario();
      /* os simulados moraram em Missões até 28/07; a casa deles é a agenda */
      if (typeof renderSimulados === 'function') renderSimulados();
      if (typeof renderSimHist === 'function') renderSimHist();
    }
    if (id.indexOf('v-prof-') === 0 && typeof renderProfTudo === 'function') renderProfTudo();
    /* abrir a Recepção é o que marca os recados como lidos */
    if (id === 'v-prof-chat' && typeof renderProfRecados === 'function') renderProfRecados();
    spotlight($(id));
  }
  spotlight($('v-inicio'));
  document.querySelectorAll('.nav-btn').forEach(function (nb) {
    nb.addEventListener('click', function () {
      if (appLock && personaAtiva === 'aluno' && nb.closest('nav').id === 'navAluno' && nb.dataset.view !== 'v-loja') {
        toast('Funções bloqueadas — matricule-se em uma turma na Quad Store para liberar.');
        return;
      }
      showView(nb.dataset.view, nb.closest('nav').id);
    });
  });

  /* ---------- árvore do edital · CFO PM-BA ----------
     Progresso simulado na V0, determinístico por nome (hash) com viés por matéria.
     Regra de agregação (de baixo para cima):
       barra do assunto  = média das barras dos sub-assuntos
       barra da matéria  = média das barras dos assuntos                    */
  __SEED_EDITAL_CFO__
  var ED_BASE = [72, 48, 60, 55, 42, 46, 64, 52, 58, 38, 33, 28, 24];
  /* ---------- Estrutura: concursos, editais, modalidades e turmas ----------
     Cada concurso tem a sua árvore de edital. O CFO usa a árvore completa
     acima; os demais trazem árvores-exemplo compactas na V0 (a árvore real
     entra pelo lançamento do edital — [INTEGRAÇÃO REAL]). Definir o edital de
     um concurso para a turma troca o Domínio que o aluno vê.               */
  __SEED_EDITAL_SOLDADO__
  __SEED_EDITAL_PPBA__
  __SEED_EDITAL_PCBA__
  var EDITAL_PRF = [
    ['Língua Portuguesa', [['Interpretação de textos', ['Textos verbais', 'Argumentação']], ['Gramática', ['Concordância', 'Regência']]]],
    ['Legislação de Trânsito', [['Código de Trânsito', ['Normas gerais', 'Infrações']], ['Habilitação', ['Categorias', 'Penalidades']]]],
    ['Direito Administrativo', [['Princípios', ['Legalidade', 'Moralidade']], ['Poderes', ['Poder de polícia', 'Hierárquico']]]],
    ['Física aplicada', [['Cinemática', ['Velocidade', 'Aceleração']], ['Dinâmica', ['Forças', 'Atrito']]]]
  ];
  __SEED_CONCURSOS__
  var SITUACOES = [['aberto', 'Edital aberto'], ['proposta', 'Proposta de edital para este ano'], ['reta-final', 'Reta final · pós-edital']];
  function situacaoNome(s) { for (var i = 0; i < SITUACOES.length; i++) if (SITUACOES[i][0] === s) return SITUACOES[i][1]; return s; }
  /* o tipo da turma é o QUE ela é; RONDESP/PATAMO/BOPE são apelidos que o
     Quad usa hoje e que o administrador troca no campo "Apelido"        */
  var MODALIDADES = [
    { id: 'RONDESP', nome: 'Turma de nivelamento', apelido: 'RONDESP', teoria: 70, questoes: 30, desc: 'mais teoria — base do conteúdo' },
    { id: 'PATAMO',  nome: 'Turma regular',        apelido: 'PATAMO',  teoria: 50, questoes: 50, desc: 'teoria e questões equilibradas' },
    { id: 'BOPE',    nome: 'Turma de questões',    apelido: 'BOPE',    teoria: 20, questoes: 80, desc: 'mais questões — alta intensidade' }
  ];
  function modalidadeDe(id) { for (var i = 0; i < MODALIDADES.length; i++) if (MODALIDADES[i].id === id) return MODALIDADES[i]; return null; }
  /* o turno SAI do horário — não há como marcar "noite" e digitar 8h */
  function turnoDoHorario(hi) {
    var h = parseInt(String(hi || '').split(':')[0], 10);
    if (isNaN(h)) return '';
    return h < 12 ? 'manhã' : h < 18 ? 'tarde' : 'noite';
  }
  var EDITAL_ATUAL = EDITAL_CFO;     /* árvore que o Domínio do aluno mostra */
  var CONCURSO_ATUAL_ID = 'cfo';
  function concursoDe(id) { for (var i = 0; i < CONCURSOS.length; i++) if (CONCURSOS[i].id === id) return CONCURSOS[i]; return null; }
  function edHash(str) {
    var h = 0;
    for (var i = 0; i < str.length; i++) { h = (h * 31 + str.charCodeAt(i)) >>> 0; }
    return h;
  }
  var trAj = {};    /* 'concurso|matéria|assunto' → deslocamento do Treinamento Rápido */
  var trAjSub = {}; /* 'concurso|matéria|assunto|sub' → deslocamento da revisão do Domínio (dec. 202) */
  function edSubPct(mi, mat, ass, sub) {
    var base = (ED_BASE[mi] != null) ? ED_BASE[mi] : (40 + (edHash(mat) % 40));
    var v = base + (edHash(mat + '|' + ass + '|' + sub) % 41) - 20
          + (trAj[CONCURSO_ATUAL_ID + '|' + mat + '|' + ass] || 0)
          + (trAjSub[CONCURSO_ATUAL_ID + '|' + mat + '|' + ass + '|' + sub] || 0);
    return Math.max(0, Math.min(100, v));
  }
  function edAvg(arr) { return arr.reduce(function (a, b) { return a + b; }, 0) / (arr.length || 1); }
  /* escala térmica: 0% = vermelho → 50% = âmbar → 100% = azul Quad.
     Curva em dois trechos para o quente dominar a metade baixa da escala. */
  function edHue(pct) {
    if (pct <= 50) { return Math.round((pct / 50) * 45); }        /* 0..45: vermelho → âmbar */
    return Math.round(45 + ((pct - 50) / 50) * 172);              /* 45..217: âmbar → azul  */
  }
  function edFill(pct) {
    return '<i style="width:' + Math.round(pct) + '%;background:hsl(' + edHue(pct) + ',82%,50%)"></i>';
  }
  function edPcColor(pct) { return 'hsl(' + edHue(pct) + ',78%,38%)'; }
  function edBar(pct) { return '<span class="ed-bar">' + edFill(pct) + '</span>'; }
  function renderEdital() {
    var box = $('editalTree');
    if (!box) { return; }
    /* re-render não fecha o que o aluno abriu: quem volta da revisão de
       um subassunto encontra a árvore como deixou (dec. 202). Se a
       ÁRVORE trocou (Definir Domínio), a memória não vale — recomeça. */
    var abertos = (renderEdital.arvore === EDITAL_ATUAL)
      ? [].map.call(box.querySelectorAll('.ed-mat, .ed-ass'), function (el, i) {
          return el.classList.contains('open') ? i : -1;
        }).filter(function (i) { return i >= 0; })
      : [];
    renderEdital.arvore = EDITAL_ATUAL;
    var html = '';
    EDITAL_ATUAL.forEach(function (mat, mi) {
      var matNm = mat[0], assuntos = mat[1];
      var assPcts = assuntos.map(function (ass) {
        return edAvg(ass[1].map(function (sub) { return edSubPct(mi, matNm, ass[0], sub); }));
      });
      var matPct = edAvg(assPcts);
      var assHtml = assuntos.map(function (ass, ai) {
        var q = encodeURIComponent(matNm + ' ' + ass[0]);
        var acoes = '<div class="ed-actions">' +
          '<a href="https://www.youtube.com/results?search_query=' + encodeURIComponent('aula ' + matNm + ' ' + ass[0] + ' concurso') + '" target="_blank" rel="noopener">\u25B6 Assistir aula</a>' +
          '<a href="https://www.qconcursos.com/questoes-de-concursos/questoes?q=' + q + '" target="_blank" rel="noopener">\u270E Fazer quest\u00F5es</a>' +
          '</div>';
        var subHtml = ass[1].map(function (sub, si) {
          var sp = edSubPct(mi, matNm, ass[0], sub);
          /* dec. 204 — o play abre o PRÓXIMO pacote de 10 daquele
             subassunto (banco por subassunto); está sempre aceso porque
             todo subassunto tem os pacotes-modelo na demo             */
          return '<div class="ed-srow"><span class="ed-nm">' + (mi + 1) + '.' + (ai + 1) + '.' + (si + 1) + ' ' + sub + '</span>' +
                 '<button type="button" class="ed-q10" data-q10-m="' + matNm + '" data-q10-a="' + ass[0] + '" data-q10-s="' + sub + '"' +
                 ' title="Treinar aqui — pacotes de 10 questões de ' + sub + '" aria-label="Treinar ' + sub + '">' +
                 '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5 L10.5 6 L3 10.5 Z" fill="currentColor"/></svg></button>' + edBar(sp) +
                 '<span class="ed-pc" style="color:' + edPcColor(sp) + '">' + Math.round(sp) + '%</span></div>';
        }).join('');
        return '<div class="ed-ass">' +
          '<button class="ed-head" type="button"><span class="chev">\u25B8</span>' +
          '<span class="ed-nm">' + (mi + 1) + '.' + (ai + 1) + ' ' + ass[0] + '</span>' +
          '<span class="ed-pc" style="color:' + edPcColor(assPcts[ai]) + '">' + Math.round(assPcts[ai]) + '%</span></button>' +
          '<div class="ed-bar">' + edFill(assPcts[ai]) + '</div>' +
          '<div class="ed-sublist">' + acoes + subHtml + '</div></div>';
      }).join('');
      html += '<div class="ed-mat' + (mi === 0 ? ' open' : '') + '">' +
        '<button class="ed-head" type="button"><span class="chev">' + (mi === 0 ? '\u25BE' : '\u25B8') + '</span>' +
        '<span class="ed-nm">' + (mi + 1) + '. ' + matNm + '</span>' +
        '<span class="ed-pc" style="color:' + edPcColor(matPct) + '">' + Math.round(matPct) + '%</span></button>' +
        '<div class="ed-bar">' + edFill(matPct) + '</div>' +
        '<div class="ed-asslist">' + assHtml + '</div></div>';
    });
    box.innerHTML = html;
    if (abertos.length) {
      var els = box.querySelectorAll('.ed-mat, .ed-ass');
      abertos.forEach(function (i) {
        if (!els[i]) return;
        els[i].classList.add('open');
        var ch = els[i].querySelector('.ed-head .chev'); if (ch) ch.textContent = '\u25BE';
      });
    }
  }
  renderEdital();
  $('editalTree').addEventListener('click', function (ev) {
    var q10 = ev.target.closest('.ed-q10');
    if (q10) {
      if (typeof trAbrirSub === 'function') trAbrirSub(q10.dataset.q10M, q10.dataset.q10A, q10.dataset.q10S);
      return;
    }
    var head = ev.target.closest('.ed-head');
    if (!head) { return; }
    var item = head.parentElement;
    item.classList.toggle('open');
    head.querySelector('.chev').textContent = item.classList.contains('open') ? '\u25BE' : '\u25B8';
  });
